<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f1c" />
    <!-- Phones: "Add to Home Screen" launches without browser bars (iPhone has no Fullscreen API for pages). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gyoza Express" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="A tiny gyoza ship delivering warm things across a soft galaxy."
    />
    <title>Cosmic Gyoza Express</title>
    <!-- First-paint guard: shell CSS arrives with the JS bundle; keep the page cosmos-dark until then (matches --color-cosmos-deep). -->
    <style>
      html,
      body {
        margin: 0;
        background: #0e0f1c;
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-label="Cosmic Gyoza Express">
      <div id="game-root" class="game-root"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
